# Types, tests, build. No Notion token: the build reads committed files only,
# which is the point of the sync design — CI can verify a deploy without any
# credential at all.
#
# Deliberately absent: `npm run sync -- --check`. Notion having newer content
# than the last sync commit is the normal state between hourly runs, not a
# broken pull request.
name: CI

on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert the build carries no Notion URLs
        # A presigned Notion URL in the output would 403 about an hour after the
        # build. This is the regression test for the whole image pipeline.
        run: |
          if grep -rlE 'file\.notion\.com|prod-files-secure|amazonaws\.com' dist; then
            echo "::error::Built output references Notion-hosted files; images were not downloaded."
            exit 1
          fi
          echo "No Notion URLs in dist/."
